<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天气小课堂 · 四季漫步 v3</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#bfe3f7;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
canvas{display:block;position:fixed;left:0;top:0;z-index:0;filter:saturate(1.12)}
#badge{z-index:1000;position:fixed;top:16px;left:18px;background:rgba(30,40,55,.55);backdrop-filter:blur(8px);border-radius:16px;padding:12px 18px 10px;color:#fff;min-width:132px;box-shadow:0 4px 18px rgba(0,0,0,.18);pointer-events:none}
#badge .row{display:flex;align-items:flex-start;gap:10px}
#badge .han{font-size:42px;font-weight:800;line-height:1;letter-spacing:-1px}
#badge .meta{display:flex;flex-direction:column;padding-top:4px}
#badge .en{font-size:15px;font-weight:800;letter-spacing:1px;line-height:1.1}
#badge .en::after{content:"";display:block;height:2px;width:100%;margin-top:3px;border-radius:1px;background:currentColor;opacity:.85}
#badge .sub{font-size:13px;opacity:.92;margin-top:4px}
#badge .idx{font-size:12px;opacity:.75;margin-top:6px;letter-spacing:1px}
#progress{z-index:1000;position:fixed;top:22px;right:20px;display:flex;gap:6px;pointer-events:none}
#progress i{display:block;width:28px;height:6px;border-radius:4px;background:rgba(40,50,65,.45);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
#progress i.on{box-shadow:none}
#ui{z-index:1000;position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:12px;padding:10px 14px;background:rgba(255,255,255,.55);border-radius:28px;backdrop-filter:blur(6px);box-shadow:0 6px 24px rgba(0,60,120,.15)}
#ui button{font-size:22px;font-weight:700;width:64px;height:64px;border:none;border-radius:50%;cursor:pointer;color:#35506b;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.12);transition:transform .2s,background .3s,color .3s}
#ui button:hover{transform:translateY(-3px)}
#ui button.on{background:#ffb938;color:#fff;transform:translateY(-3px) scale(1.06)}
#ui button span{display:block;font-size:12px;font-weight:400;margin-top:-2px}
#hint{z-index:1000;position:fixed;bottom:96px;left:50%;transform:translateX(-50%);color:#35506b;background:rgba(255,255,255,.55);padding:6px 14px;border-radius:14px;font-size:13px;pointer-events:none;white-space:nowrap}
#err{display:none;position:fixed;z-index:1001;top:50px;left:50%;transform:translateX(-50%);background:#fff3f3;color:#a33;padding:8px 14px;border-radius:10px;font-size:14px}
</style>
<meta http-equiv="Cache-Control" content="no-cache">
<script type="importmap">{"imports":{"three":"./lib/three.module.js?v=186","three/addons/":"./lib/addons/"}}</script>
</head>
<body>
<div id="badge">
  <div class="row">
    <div class="han" id="badge-han">春</div>
    <div class="meta">
      <div class="en" id="badge-en">SPRING</div>
      <div class="sub" id="badge-sub">春雨</div>
      <div class="idx" id="badge-idx">01 / 04</div>
    </div>
  </div>
</div>
<div id="progress"><i class="on"></i><i></i><i></i><i></i></div>
<div id="hint">点击切换季节</div>
<div id="ui">
<button data-w="spring">🌸<span>春</span></button>
<button data-w="summer">☀️<span>夏</span></button>
<button data-w="autumn">🍂<span>秋</span></button>
<button data-w="winter">❄️<span>冬</span></button>
</div>
<div id="err"></div>
<script>
window.__pendingWeather = null;
document.querySelectorAll('#ui button').forEach(function(b){ b.addEventListener('click', function(){
  document.querySelectorAll('#ui button').forEach(function(x){ x.classList.toggle('on', x===b); });
  if (window.setWeather) window.setWeather(b.dataset.w); else window.__pendingWeather = b.dataset.w; }); });
window.addEventListener('error', function(e){ var d=document.getElementById('err'); d.style.display='block'; d.textContent='3D 场景加载出错：' + (e.message||e); });
</script>
<script type="module" src="./main.js?v=1792759500"></script>
</body>
</html>
